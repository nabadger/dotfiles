# Persist ThinkPad volume hotkey enable across reboots (sysfsutils)
# Install: sudo apt install sysfsutils
#          sudo cp this-file /etc/sysfs.d/thinkpad-volume-keys.conf
#          sudo systemctl restart sysfsutils
# Or one-shot: sudo ~/bin/thinkpad-enable-volume-keys
devices/platform/thinkpad_acpi/hotkey_mask = 0xff8f7ffb
