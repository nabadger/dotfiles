# Fuzzel — app launcher (sized for Sway scale, not raw DPI)
# dpi-aware=no → follows compositor scale (1.5) like other UI

font=Hack:size=12
dpi-aware=no
prompt=❯ 
icon-theme=Yaru
icons-enabled=yes
fields=filename,name,generic
tabs=4
horizontal-pad=16
vertical-pad=8
inner-pad=6
line-height=22
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1c1c1cee
text=f2f2f2ff
prompt=E95420ff
placeholder=888888ff
input=ffffffff
match=E95420ff
selection=E95420ff
selection-text=ffffffff
selection-match=ffffffff
border=E95420ff

[border]
width=2
radius=8

[dmenu]
mode=text
exit-immediately-if-empty=no
