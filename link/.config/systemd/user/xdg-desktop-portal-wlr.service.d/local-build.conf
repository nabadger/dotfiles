[Service]
# meson install from upgrade-xdg-desktop-portal-wlr lands in /usr/local; distro unit still points at apt 0.8.1.
ExecStart=
ExecStart=/usr/local/libexec/xdg-desktop-portal-wlr
Environment=XDG_CURRENT_DESKTOP=sway
PassEnvironment=WAYLAND_DISPLAY SWAYSOCK DISPLAY XDG_RUNTIME_DIR XDG_SESSION_TYPE
