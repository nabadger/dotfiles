# Foot terminal — black background

[main]
font=Hack:size=9
pad=4x4
dpi-aware=yes
# Copy selection to both primary (middle-click) and clipboard (Ctrl+V in GUI apps)
selection-target=both

[colors]
alpha=1.0
foreground=ffffff
background=000000
# text color, cursor color — orange so blink is obvious on black
cursor=000000 E95420

## Normal
regular0=000000
regular1=cd3131
regular2=0dbc79
regular3=e5e510
regular4=2472c8
regular5=bc3fbc
regular6=11a8cd
regular7=e5e5e5

## Bright
bright0=666666
bright1=f14c4c
bright2=23d18b
bright3=f5f543
bright4=3b8eea
bright5=d670d6
bright6=29b8db
bright7=ffffff

[cursor]
style=block
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes
